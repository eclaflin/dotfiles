# Index windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Better colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support
set -g mouse on

# Allow transparency to show through from the terminal
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# Catppuccin Frappé
set -g status-style "bg=#303446,fg=#c6d0f5"
set -g status-left "#[bg=#ca9ee6,fg=#303446,bold] #S #[bg=#303446,fg=#ca9ee6]"
set -g status-right "#[fg=#8caaee]#[bg=#8caaee,fg=#303446] %H:%M #[bg=#626880,fg=#303446] %Y-%m-%d "
set -g status-left-length 40
set -g window-status-format "#[bg=#414559,fg=#c6d0f5] #I #W "
set -g window-status-current-format "#[bg=#ca9ee6,fg=#303446,bold] #I #W "
set -g pane-border-style "fg=#414559"
set -g pane-active-border-style "fg=#ca9ee6"
set -g message-style "bg=#ca9ee6,fg=#303446"

# Increase scrollback buffer
set -g history-limit 10000

# Split panes with | and - (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
