

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

autogenerated = 0
exec-once = waybar

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher
$browser = firefox

bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, Z, fullscreen, 1

# Screen brightness (Touch Bar)
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Keyboard backlight (Touch Bar)
bindl = , XF86KbdBrightnessUp, exec, brightnessctl -d spi::kbd_backlight set +25
bindl = , XF86KbdBrightnessDown, exec, brightnessctl -d spi::kbd_backlight set 25-
